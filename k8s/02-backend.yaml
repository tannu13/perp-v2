apiVersion: apps/v1
kind: Deployment
metadata:
  name: backend
  namespace: perps-app
spec:
  # Safe at 2 only because APP_STAGE below is `prod`. Each pod then takes its
  # own Redis consumer group and receives every engine reply; sharing one group
  # deals each reply to exactly one pod, so a reply routinely lands on a pod
  # that is not holding the caller and the original request times out.
  replicas: 2
  selector:
    matchLabels:
      app: backend
  template:
    metadata:
      labels:
        app: backend
    spec:
      containers:
        - name: backend
          image: tannnu13/perps-v2-backend:v2
          ports:
            - containerPort: 3000
          env:
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: perps-secrets
                  key: DATABASE_URL
            - name: REDIS_URL
              value: "redis://host.minikube.internal:6379"
            - name: APP_PORT
              value: "3000"
            # Not cosmetic here, and the only thing this service reads it
            # for: session-cookie.ts gates `Secure` and the `__Host-` prefix on
            # it. Under `development` the session cookie ships without either,
            # which on a domain shared with anything else means a sibling can
            # overwrite it. Requires TLS to be terminated in front of this —
            # a `Secure` cookie set over plain http is simply dropped, so a
            # minikube deploy reached over http needs this back at
            # `development` (see the ingress).
            - name: NODE_ENV
              value: production
            # Browser origins allowed to call this API. No wildcard — CORS
            # forbids `*` alongside credentials, and this API only answers with
            # credentials. Without this the schema default is localhost:3020
            # and every request from the deployed frontend is rejected by
            # verify-origin.ts with ORIGIN_NOT_ALLOWED.
            #
            # The frontend is on CloudFront, not in this cluster, so this is
            # the CDN's hostname — and it must match the origin the browser
            # sends exactly: scheme included, no trailing slash.
            - name: CORS_ORIGINS
              value: "https://web.perps.tanujpant.com"
            # Gives each pod its own consumer group — see backend-comms.ts.
            # `dev` shares one group across all pods, which silently breaks
            # request/reply correlation at any replica count above 1.
            - name: APP_STAGE
              value: prod
            - name: SALT_ROUNDS
              value: "10"
            - name: JWT_SECRET
              valueFrom:
                secretKeyRef:
                  name: perps-secrets
                  key: JWT_SECRET
---
apiVersion: v1
kind: Service
metadata:
  name: backend-service
  namespace: perps-app
spec:
  selector:
    app: backend
  ports:
    - protocol: TCP
      port: 3000
      targetPort: 3000
