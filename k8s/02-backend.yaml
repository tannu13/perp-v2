apiVersion: apps/v1
kind: Deployment
metadata:
  name: backend
  namespace: perps-app
spec:
  # Safe at 2 only because APP_STAGE below is `prod`. Each pod then takes its
  # own Redis consumer group and receives every engine reply; sharing one group
  # deals each reply to exactly one pod, so a reply routinely lands on a pod
  # that is not holding the caller and the original request times out.
  replicas: 2
  selector:
    matchLabels:
      app: backend
  template:
    metadata:
      labels:
        app: backend
    spec:
      containers:
        - name: backend
          image: tannnu13/perps-v2-backend:v2
          ports:
            - containerPort: 3000
          env:
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: perps-secrets
                  key: DATABASE_URL
            - name: REDIS_URL
              value: "redis://host.minikube.internal:6379"
            - name: APP_PORT
              value: "3000"
            - name: NODE_ENV
              value: development
            # Gives each pod its own consumer group — see backend-comms.ts.
            # `dev` shares one group across all pods, which silently breaks
            # request/reply correlation at any replica count above 1.
            - name: APP_STAGE
              value: prod
            - name: SALT_ROUNDS
              value: "10"
            - name: JWT_SECRET
              valueFrom:
                secretKeyRef:
                  name: perps-secrets
                  key: JWT_SECRET
---
apiVersion: v1
kind: Service
metadata:
  name: backend-service
  namespace: perps-app
spec:
  selector:
    app: backend
  ports:
    - protocol: TCP
      port: 3000
      targetPort: 3000
