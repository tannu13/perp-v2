apiVersion: apps/v1
kind: Deployment
metadata:
  name: engine
  namespace: perps-app
spec:
  replicas: 1
  selector:
    matchLabels:
      app: engine
  template:
    metadata:
      labels:
        app: engine
    spec:
      containers:
        - name: engine
          image: tannnu13/perps-v2-engine:v2
          env:
            - name: NODE_ENV
              value: development
            - name: APP_STAGE
              value: dev
            - name: REDIS_URL
              value: "redis://host.minikube.internal:6379"
            - name: INCOMING_STREAM
              value: backend-to-engine-trade-comms
            - name: OUTGOING_STREAM
              value: engine-to-backend-trade-comms
            - name: LISTENER_GROUP
              value: engine-group
            - name: LISTENER_GROUP_CONSUMER
              value: engine
            - name: AWS_REGION
              value: ap-south-1
            # `optional: true` so an AWS deploy can ship a Secret without
            # these keys at all and let the SDK's default chain reach the
            # instance/task role. See apps/engine/src/env.ts.
            - name: AWS_ACCESS_KEY_ID
              valueFrom:
                secretKeyRef:
                  name: perps-secrets
                  key: AWS_ACCESS_KEY_ID
                  optional: true
            - name: AWS_SECRET_ACCESS_KEY
              valueFrom:
                secretKeyRef:
                  name: perps-secrets
                  key: AWS_SECRET_ACCESS_KEY
                  optional: true
            - name: AWS_BUCKET_NAME
              value: s30-perps-store-backups-bucket-410940411202-ap-south-1-an
            # Local MinIO. Delete this block (and set NODE_ENV=production
            # above) for a deploy that should reach real S3 — its presence is
            # what selects the MinIO client.
            - name: MINIO_ENDPOINT
              value: http://host.minikube.internal:9000
