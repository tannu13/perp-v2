# Copy this file to k8s/01a-secrets.yaml, fill in real values, apply it before the
# Deployments. The copy is gitignored — nothing in this directory may carry a
# live credential again.
#
#   cp k8s/01a-secrets.example.yaml k8s/01a-secrets.yaml
#   $EDITOR k8s/01a-secrets.yaml
#   kubectl apply -f k8s/01a-secrets.yaml
#
# A Kubernetes Secret is base64, not encryption — this is about keeping
# credentials out of git, not about keeping them from anyone holding kubectl.
# On AWS the same keys come from SSM Parameter Store (SecureString, free at
# this scale) instead, mounted by whatever runs the workload: valueFrom on an
# ECS task definition, or External Secrets / Secrets Store CSI on EKS.
apiVersion: v1
kind: Secret
metadata:
  name: perps-secrets
  namespace: perps-app
type: Opaque
stringData:
  # openssl rand -hex 32. Rotating this invalidates every issued session.
  JWT_SECRET: "replace-me"

  # The market maker signs up with these on first boot, then signs in with them
  # on every restart — change one after the account exists and the bot is locked
  # out of its own inventory. Any 8+ characters; they guard bot accounts holding
  # play money, not a user's funds.
  MM_PASSWORD: "replace-me"
  TAKER_PASSWORD: "replace-me"

  # Password must match POSTGRES_PASSWORD wherever Postgres actually runs.
  DATABASE_URL: "postgresql://perps_user:replace-me@host.minikube.internal:5432/perps_db"

  # Local MinIO only. Leave both EMPTY on AWS: the engine reads them as unset
  # and falls back to the SDK's default chain, which is how the instance or
  # task role gets used. A value here overrides the role.
  AWS_ACCESS_KEY_ID: "fake-local-key"
  AWS_SECRET_ACCESS_KEY: "fake-local-secret"
